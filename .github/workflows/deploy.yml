name: Deploy

on:
  pull_request:
    branches:
      - main
      - staging

  push:
    branches:
      - main
      - staging

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Test application
        run: |
          docker build -t lacrei-app .
          docker run -d --name lacrei-test -p 3000:3000 lacrei-app

          for i in {1..10}; do
            if curl -sf http://127.0.0.1:3000/status; then
              docker rm -f lacrei-test
              exit 0
            fi

            sleep 2
          done

          docker rm -f lacrei-test
          exit 1

      - name: Terraform Format
        working-directory: terraform/modules
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/modules
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/modules
        run: terraform validate

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/modules
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=lacrei/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: terraform/modules
        run: terraform apply -auto-approve

      - name: Terraform Outputs
        id: terraform
        working-directory: terraform/modules
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t "${{ steps.terraform.outputs.ecr_url }}:${GITHUB_SHA}" .
          docker push "${{ steps.terraform.outputs.ecr_url }}:${GITHUB_SHA}"

      - name: Deploy to EC2
        run: |
          INSTANCE_ID="${{ steps.terraform.outputs.instance_id }}"

          for i in {1..30}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Online" ]; then
              break
            fi

            sleep 10
          done

          ECR_URL="${{ steps.terraform.outputs.ecr_url }}"
          ECR_REGISTRY="${ECR_URL%/*}"
          IMAGE="${ECR_URL}:${GITHUB_SHA}"

          cat > /tmp/ssm.json <<JSON
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE}",
              "docker rm -f lacrei-app || true",
              "docker run -d --name lacrei-app --restart unless-stopped -p 127.0.0.1:3000:3000 ${IMAGE}"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm.json \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Validate HTTPS Endpoint
        run: |
          URL="https://${{ steps.terraform.outputs.public_ip }}/status"

          for i in {1..12}; do
            if curl -skf "$URL"; then
              exit 0
            fi

            sleep 5
          done

          exit 1